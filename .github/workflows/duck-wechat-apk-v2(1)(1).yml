name: Build Duck WeChat Monitor APK V2

on:
  push:
    paths:
      - 'duck-wechat-monitor-source.zip'
      - '.github/workflows/duck-wechat-apk-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already provide Android SDK.
      # android-actions/setup-android@v3 currently attempts to install obsolete package "tools".
      - name: Make Android SDK command line tools available
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            if [ -z "$SDKMANAGER" ]; then echo 'Android sdkmanager is missing'; exit 1; fi
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          sdkmanager --version
      - name: Install Android platform 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: unzip -q duck-wechat-monitor-source.zip -d app-source
      - name: UI smoke test
        run: node app-source/tests/ui-smoke.cjs
      - name: Build debug APK
        run: gradle --no-daemon -p app-source :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duck-WeChat-Monitor-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
