name: Build Duck WeChat Monitor APK V3

on:
  push:
    paths:
      - 'duck-wechat-monitor-source.zip'
      - '.github/workflows/duck-monitor-build-20261024.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -n "$SDKMANAGER" || { echo 'Missing sdkmanager'; exit 1; }
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi
          sdkmanager --version
      - name: Install SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and locate app project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-source
          unzip -q duck-wechat-monitor-source.zip -d app-source
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/app-source" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo 'Could not find Android settings.gradle inside the ZIP.'
            find app-source -maxdepth 4 -type f | head -60
            exit 1
          fi
          APP_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$APP_DIR/app/src/main/AndroidManifest.xml" || { echo 'AndroidManifest.xml missing'; exit 1; }
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $APP_DIR"
      - name: UI validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$APP_DIR/tests/ui-smoke.cjs" ]]; then
            node "$APP_DIR/tests/ui-smoke.cjs"
          else
            echo 'No UI smoke-test script in ZIP. Verifying bundled app HTML instead.'
            test -s "$APP_DIR/app/src/main/assets/index.html"
          fi
      - name: Build Android debug APK
        shell: bash
        run: gradle --no-daemon -p "$APP_DIR" :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Duck-WeChat-Monitor-APK-V3
          path: app-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
