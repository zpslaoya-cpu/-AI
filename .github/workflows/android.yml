name: Build Laoya APK

on:
  workflow_dispatch:
  push:
    paths:
      - laoya-capture.zip
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: unzip -q laoya-capture.zip -d source

      - name: Build APK
        shell: bash
        run: |
          project="$(find source -name settings.gradle -print -quit)"
          if [ -z "$project" ]; then
            echo "找不到安卓工程 settings.gradle"
            exit 1
          fi
          gradle --no-daemon -p "$(dirname "$project")" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Laoya-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
