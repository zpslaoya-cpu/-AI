name: Build OldDuck Ximalaya APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'oldduck-ximalaya-v1.1-source.zip'
      - '.github/workflows/oldduck-ximalaya-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack source ZIP
        run: |
          test -s oldduck-ximalaya-v1.1-source.zip
          mkdir -p source
          unzip -q oldduck-ximalaya-v1.1-source.zip -d source
          test -f source/android-ximalaya/settings.gradle
      - name: Build Android debug APK
        run: gradle --no-daemon -p source/android-ximalaya :app:assembleDebug
      - name: Pack APK in ZIP
        run: |
          mkdir -p dist
          cp source/android-ximalaya/app/build/outputs/apk/debug/app-debug.apk dist/oldduck-ximalaya-v1.1.apk
          cd dist
          zip -9 oldduck-ximalaya-v1.1-apk.zip oldduck-ximalaya-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oldduck-ximalaya-v1.1-apk
          path: dist/oldduck-ximalaya-v1.1-apk.zip
          if-no-files-found: error
