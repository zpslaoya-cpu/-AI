name: AI Video Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/video.yml"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install gradio_client requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test Hugging Face video backend
        run: |
          python - <<'PY'
          from gradio_client import Client

          spaces = [
              "ZeroCollabs/LTX-2.3-turbo",
              "Lightricks/ltx-video-distilled"
          ]

          for space in spaces:
              print("=" * 60)
              print("TESTING:", space)

              try:
                  client = Client(space)
                  print("CONNECTED:", space)
                  print(client.view_api())
                  print("SUCCESS:", space)
                  break

              except Exception as e:
                  print("FAILED:", space)
                  print(repr(e))
          else:
              raise RuntimeError("No video Space could be reached")
          PY

      - name: Create probe result
        if: always()
        run: |
          mkdir -p output
          echo "AI video backend probe completed" > output/result.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-test
          path: output/
